[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-designer"
version = "0.2.0"
description = "Padlock probe design pipeline for spatial transcriptomics"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "biopython>=1.78",
    "requests",
    "pyyaml",
    "tqdm",
    "openpyxl",
    "beautifulsoup4",
    "typer>=0.12",
    "python-dotenv>=1.0",
    # DNA nearest-neighbor duplex energies; imported unguarded by the
    # cross-ligation and orthogonality screens (audit R10).
    "primer3-py>=2.0.0",
]

[project.optional-dependencies]
structure = ["ViennaRNA>=2.7.0"]
mutation = []
all = ["probe-designer[structure,mutation]"]
dev = ["pytest", "pytest-cov", "responses"]

[project.scripts]
probe-design = "probe_designer.cli.app:app"

[tool.setuptools.packages.find]
include = ["probe_designer*"]
