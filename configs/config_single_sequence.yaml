# Configuration for single-sequence binding site search
# (renamed from 'brute_force' in Phase 5).
# Input: one mRNA sequence per gene (NCBI) or one full-length isoform (Ensembl).

database:
  database_type: "ensembl"
  api_key: "${ENTREZ_API_KEY}"
  email: "${ENTREZ_EMAIL}"

search:
  search_strategy: "single_sequence"
  binding_site_length: 40
  max_binding_sites: 100
  window_size: 50
  step_size: 1
  genes_file: "path/to/your/gene_list.txt"  # Path to gene list file (can be overridden by --genes_file)

filter:
  # Schema-v2 (2026-05-14): gate on GC%; legacy G-only fields kept for back-compat
  min_gc_content: 0.35
  max_gc_content: 0.65
  min_g_content: 0.3    # DEPRECATED
  max_g_content: 0.7    # DEPRECATED
  max_consecutive_g: 5
  max_consecutive_a: 5
  max_consecutive_t: 5
  max_consecutive_c: 5
  min_tm: 50.0
  max_tm: 65.0
  max_tm_diff: 10.0
  min_free_energy: -10.0
  check_rna_structure: true
  require_specificity: true
  final_probes_per_gene: 3

blast:
  blast_type: "local"
  database: "refseq_rna"
  task: "megablast"
  evalue: 1.0e-5
  hitlist_size: 100
  alignments: 500
  descriptions: 500
  megablast: true
  short_query: false
  filter: "none"
  format_type: "XML"
  service: "plain"
  batch_size: 100
  concurrency: 3
  species: ["Homo sapiens"]

output:
  output_dir: "results"
  save_fasta: true
  save_json: true
  save_excel: true

genome:
  accessor_priority: ["local", "ensembl"]  # Priority order: "local" uses local FASTA file, "ensembl" uses Ensembl API

species: "human"  # Default species (can be overridden by --species)
