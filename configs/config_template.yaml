# Configuration Template for DNA Probe Design
# This file contains all parameters for database access, search strategies, filtering, BLAST analysis, and output
# Copy this file and modify according to your needs

# ============================================================================
# Database Configuration
# ============================================================================
database:
  # Database connection settings
  database_type: "ensembl"  # "ensembl" or "ncbi"
  # Note: api_key and email are not used in current implementation
  # They are kept for backward compatibility but not required

# ============================================================================
# Search Configuration
# ============================================================================
search:
  # Binding site search strategy
  search_strategy: "isoform_consensus"  # Options: "brute_force", "exon_junction", "isoform_specific", "isoform_consensus"
  
  # Binding site parameters
  binding_site_length: 40  # Length of binding sites in base pairs (20-60 recommended)
  max_binding_sites: 100  # Maximum binding sites per gene
  
  # Search parameters (for single_sequence strategy)
  step_size: 1  # Step size for sliding window search (optional, only for single_sequence)
  
  # Gene list file
  genes_file: "path/to/your/gene_list.txt"  # Path to gene list file (can be overridden by --genes_file argument)

# ============================================================================
# Filter Configuration
# ============================================================================
filter:
  # Pre-BLAST thermal filtering criteria
  min_g_content: 0.3  # Minimum G content (0.0-1.0)
  max_g_content: 0.7  # Maximum G content (0.0-1.0)
  max_consecutive_g: 5  # Maximum consecutive G nucleotides
  min_tm: 50.0  # Minimum melting temperature (°C)
  max_tm: 70.0  # Maximum melting temperature (°C)
  max_tm_diff: 10.0  # Maximum temperature difference between 3' and 5' arms (°C)
  min_free_energy: -10.0  # Minimum RNA secondary structure free energy (kcal/mol)
  check_rna_structure: true  # Whether to check RNA secondary structure
  
  # Post-BLAST specificity filtering
  require_specificity: true  # Whether to require specificity filtering
  max_alignments: 5  # Maximum allowed alignments for specificity check
  target_organisms: null  # Target organisms to allow (null = use blast.species or config species)

# ============================================================================
# BLAST Configuration
# ============================================================================
blast:
  # BLAST type and database
  blast_type: "local"  # "local" or "online"
  database: "refseq_rna"  # BLAST database: "nt", "refseq_rna", "nr"
  task: "megablast"  # BLAST task: "megablast", "blastn", "blastp"
  
  # BLAST search parameters
  evalue: 1.0e-5  # E-value threshold
  hitlist_size: 100  # Number of hits to return
  alignments: 500  # Number of alignments to show
  descriptions: 500  # Number of descriptions to show
  megablast: true  # Use megablast algorithm
  short_query: false  # Optimize for short queries
  filter: "none"  # Sequence filtering: "none", "L", "R", "F"
  format_type: "XML"  # Output format: "XML", "Text"
  service: "plain"  # BLAST service: "plain", "psi"
  
  # Online BLAST batching (only for blast_type: "online")
  batch_size: 20  # Number of sequences per online request
  concurrency: 3  # Number of concurrent requests
  
  # Target species for BLAST search
  species: ["Homo sapiens"]  # List of target species (e.g., ["Homo sapiens", "Mus musculus"])

# ============================================================================
# Output Configuration
# ============================================================================
output:
  output_dir: "results"  # Output directory path
  create_timestamp: true  # Create timestamped subdirectory
  save_intermediate: true  # Save intermediate files
  save_fasta: true  # Save FASTA format files
  save_json: true  # Save JSON format files
  save_excel: true  # Save Excel format files

# ============================================================================
# Genome Access Configuration
# ============================================================================
genome:
  # Genome accessor priority
  # Options: "local" (uses local FASTA file), "ensembl" (uses Ensembl API)
  accessor_priority: ["local", "ensembl"]  # Priority order: try local first, then Ensembl API
  # Note: genome_fasta_path is set in species_config.json, not here

# ============================================================================
# Species Configuration
# ============================================================================
species: "human"  # Target species: "mouse", "human", "rat", "zebrafish"
# Note: Species-specific settings (genome_fasta_path, coord_system_version, etc.)
# are loaded from code/configs/species_config.json or code/local/configs/species_config.json
