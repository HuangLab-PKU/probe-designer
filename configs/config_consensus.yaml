# Configuration for finding consensus binding sites
# Probes that bind to maximum number of isoforms per gene

database:
  database_type: "ensembl"
  api_key: "your_ncbi_api_key_here"
  email: "your_email@example.com"

search:
  search_strategy: "isoform_consensus"
  binding_site_length: 40
  max_binding_sites: 100
  window_size: 50
  step_size: 1
  genes_file: "path/to/your/gene_list.txt"  # Path to gene list file (can be overridden by --genes_file)

filter:
  # Schema-v2 (2026-05-14): gate on GC%; legacy G-only fields kept for back-compat
  min_gc_content: 0.35
  max_gc_content: 0.65
  min_g_content: 0.3    # DEPRECATED
  max_g_content: 0.7    # DEPRECATED
  max_consecutive_g: 5
  max_consecutive_a: 5
  max_consecutive_t: 5
  max_consecutive_c: 5
  min_tm: 50.0   # = lab_temp_c + tm_margin_c (45 + 5), re-anchored 2026-07-17
  max_tm: 70.0   # = lab_temp_c + 25
  max_tm_diff: 10.0
  min_free_energy: -10.0
  check_rna_structure: true
  require_specificity: true
  final_probes_per_gene: 3
  # Phase 1A (2026-05-14): target-accessibility gate. When > 0, RNAplfold
  # profiles are computed per isoform and the mean unpaired-probability of
  # each candidate window is gated. 0.30 is recommended once Phase 1A is
  # validated against a wet-lab panel; keep at 0 to use the legacy self-fold
  # MFE check for now.
  min_accessibility: 0.0
  plfold_window: 70
  plfold_span: 40
  plfold_temperature: 37.0   # raise to 47-55 to approximate formamide

blast:
  blast_type: "local"
  database: "refseq_rna"
  task: "megablast"
  evalue: 1.0e-5
  hitlist_size: 100
  alignments: 500
  descriptions: 500
  megablast: true
  short_query: false
  filter: "none"
  format_type: "XML"
  service: "plain"
  batch_size: 20
  concurrency: 3
  species: ["Homo sapiens"]

output:
  output_dir: "results"
  save_fasta: true
  save_json: true
  save_excel: true

genome:
  accessor_priority: ["local", "ensembl"]  # Priority order: "local" uses local FASTA file, "ensembl" uses Ensembl API

species: "human"
